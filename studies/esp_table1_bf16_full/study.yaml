study: esp_table1_bf16_full
description: 'Full SpecBench ESP BF16 Table1: Qwen3 BC60/1 primary, BC60/2 control;
  all four cells predeclared'
experiment:
  name: esp_table1_bf16_full
recipe: recipe.py
freeze: true
provenance:
  include:
  - docs/PLAN.md
  - docs/modelscope_snapshot.json
  - docs/prompts_manifest.json
  - docs/specbench-source.json
  - untimed_bf16.py
flow:
  study_phases: true
  prepare_shared: false
axes:
  algorithm.config:
  - task: esp_mtp
    spec:
      method: esp
      num_masks: 1
      block_complexity: 10
      impl: naive
      tree:
        mode: dynamic
        pruning: true
      mask:
        init: mean_prompt
        lam: 0.1
        update: true
  - task: esp_mtp
    spec:
      method: esp
      num_masks: 1
      block_complexity: 30
      impl: naive
      tree:
        mode: dynamic
        pruning: true
      mask:
        init: mean_prompt
        lam: 0.1
        update: true
  - task: esp_mtp
    spec:
      method: esp
      num_masks: 1
      block_complexity: 60
      impl: naive
      tree:
        mode: dynamic
        pruning: true
      mask:
        init: mean_prompt
        lam: 0.1
        update: true
  - task: esp_mtp
    spec:
      method: esp
      num_masks: 2
      block_complexity: 60
      impl: naive
      tree:
        mode: dynamic
        pruning: true
      mask:
        init: mean_prompt
        lam: 0.1
        update: true
seeds:
- 123
