# Copy studies/_template/ to studies/<name>/ before writing the question.
# Do not run this directory.

study: my_study
description: one-line question
# 不要写 origin: foreign。RPipe 一旦看到 origin 就会设置 HF_ENDPOINT；
# SpecMTP 权重走 model.config.hub: modelscope。缺省 origin 即 foreign，且不改环境变量。

experiment:
  name: first26

# SpecMTP sources are registered by the recipe (import also registers, so make can fill shared/).
recipe: recipe.py

flow:
  study_phases: true      # flow/write = exact_match gate, flow/process = Study-scope gate
  # prepare_shared defaults to true: Data lands in shared/data, weights in shared/model.

# freeze: true            # optional: refuse to run if Study, rpipe or spec_mtp sources change after make

fixed:
  data:
    name: specbench
    source: spec_mtp
    config:
      path: datasets/spec_bench/question.jsonl
      skip_per_category: 0
      take_per_category: 2
      apply_chat_template: true
      chat_template_kwargs:
        enable_thinking: false
      max_prompt_len: 2048
  model:
    name: hf_causal
    source: spec_mtp
    config:
      name_or_path: Qwen/Qwen3-0.6B
      hub: modelscope
      torch_dtype: float32
      attn_implementation: eager
  algorithm:
    mode: eval
    source: spec_mtp
    config:
      task: esp_mtp
      mask: frozen_mean
      eval:
        max_new_tokens: 100
        temperature: 0.0
        stop_on_eos: true
        num_eval_prompts: 26
        run_ar_baseline: true
        log_per_prompt: true
  system:
    config:
      device: cuda

seeds: [123]

run_description: "{mask} seed={seed}"
