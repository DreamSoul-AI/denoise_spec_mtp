# One missing endpoint of the recorded beta sweep. Plan: docs/PLAN.md

study: history_4b_beta0
description: Qwen3-4B first-26 mean-plus-gamma at beta 0

experiment:
  name: first26_beta0

fixed:
  data:
    name: specbench
    source: spec_mtp
    config:
      path: data/spec_bench/question.jsonl
      skip_per_category: 0
      take_per_category: 2
      apply_chat_template: true
      chat_template_kwargs:
        enable_thinking: false
      max_prompt_len: 2048
  model:
    name: hf_causal
    source: spec_mtp
    config:
      name_or_path: Qwen/Qwen3-4B
      hub: modelscope
      torch_dtype: float32
      attn_implementation: eager
  algorithm:
    mode: eval
    source: spec_mtp
    config:
      task: esp_mtp
      mask: mean_plus_gamma
      beta: 0
      lam: 0.1
      gamma: 1
      eval:
        max_new_tokens: 100
        temperature: 0.0
        stop_on_eos: true
        num_eval_prompts: 26
        run_ar_baseline: true
        log_per_prompt: true
  system:
    config:
      device: cuda

seeds: [123]

run_description: "4b first26 beta=0 seed={seed}"
