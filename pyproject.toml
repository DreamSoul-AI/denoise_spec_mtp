[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "denoise-spec-mtp"
version = "0.1.0"
description = "ESP speculative MTP reproduction and EMA-velocity masks on RPipe"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "accelerate",
  "datasets",
  "kornia",
  "matplotlib",
  "numpy",
  "PyYAML",
  "scipy",
  "torch",
  "torchvision",
  "transformers>=4.45",
]

[project.scripts]
rpipe = "rpipe.flow.cli:main"
spec-mtp = "spec_mtp.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rpipe*", "spec_mtp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short --strict-markers --basetemp=.tmp/pytest"
cache_dir = ".tmp/pytest-cache"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "unit: unit test",
  "integration: integration test",
  "e2e: end-to-end test",
  "location: location and structure contract",
  "content: semantic and behavior contract",
  "physical: resource metric contract",
  "p1: highest priority",
  "p2: default regression priority",
  "p3: low-frequency or auxiliary",
  "cost: cost_class c1/c2/c3/c4",
  "result_type: categorical or numeric, with detail",
  "slow: long-running",
  "external: network or optional deps",
  "gpu: requires a real GPU",
]
