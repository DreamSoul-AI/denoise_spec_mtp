# CPU smoke test for our EMA-velocity mask provider (Eq 4/5 swapped out).
run:
  algorithm: esp_mtp
  stages: [test]
  save_root: results/smoke/tiny_llama
  save_name: ema_velocity
  seed: 123
  deterministic: false

data:
  name: local_prompts
  mode: synthetic
  vocab_size: 256
  prompt_len: 32
  num_prompts: 4
  seed: 0

model:
  type: tiny_llama
  attn_implementation: eager
  tiny:
    vocab_size: 256
    hidden_size: 64
    intermediate_size: 128
    num_layers: 2
    num_heads: 4
    num_kv_heads: 2
    max_position_embeddings: 1024

eval:
  device: cpu
  max_new_tokens: 32
  temperature: 0.0
  stop_on_eos: false
  num_eval_prompts: 4
  run_ar_baseline: true
  log_per_prompt: true

spec:
  method: ema_velocity
  num_masks: 2
  impl: efficient
  tree:
    mode: static
    branches: [7, 2]
    pruning: true
  ema:
    beta: 0.9
    step_scale: 1.0     # gamma
    normalize: false    # false: m_i = e+i*gamma*vhat | true: unit vhat, len = gamma*ref
    extrapolate_ema: false # true: EMA rolls forward through the k extrapolation steps
    update: true
