study: output_space_4b_recheck_v2
description: Qwen3-4B matched input/output0/output1 count and token validation, timing
  disabled
experiment:
  name: output_space_4b_recheck_v2
recipe: recipe.py
freeze: true
provenance:
  include:
  - docs/PLAN.md
  - docs/modelscope_snapshot.json
  - docs/prompts_manifest.json
  - docs/history_inventory.json
  - untimed_4b.py
flow:
  study_phases: true
  prepare_shared: false
axes:
  algorithm.config:
  - task: esp_mtp
    spec:
      method: esp
      num_masks: 2
      impl: efficient
      tree:
        mode: static
        branches:
        - 1
        - 1
        pruning: false
      mask:
        init: mean_prompt
        update: false
        lam: 0
  - task: esp_mtp
    spec:
      method: output_hidden
      num_masks: 2
      impl: efficient
      tree:
        mode: static
        branches:
        - 1
        - 1
        pruning: false
      output:
        order: 0
        beta: 0.9
        beta_prime: 0.99
  - task: esp_mtp
    spec:
      method: output_hidden
      num_masks: 2
      impl: efficient
      tree:
        mode: static
        branches:
        - 1
        - 1
        pruning: false
      output:
        order: 1
        beta: 0.9
        beta_prime: 0.99
  - task: ar_baseline
seeds:
- 123
