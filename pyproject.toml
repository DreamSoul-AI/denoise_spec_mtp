[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "denoise-spec-mtp"
version = "0.1.0"
description = "ESP speculative MTP reproduction and EMA-velocity masks on RPipe"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "accelerate",
  "datasets",
  "kornia",
  "matplotlib",
  "numpy",
  "PyYAML",
  "scipy",
  "torch",
  "torchvision",
  "transformers>=4.45",
]

[project.scripts]
rpipe = "rpipe.flow.cli:main"
spec-mtp = "spec_mtp.flow.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rpipe*", "spec_mtp*"]

[tool.pytest.ini_options]
testpaths = ["tests/spec_mtp"]
pythonpath = ["src"]
addopts = "-q --tb=short"
cache_dir = ".tmp/pytest-cache"
filterwarnings = ["ignore::DeprecationWarning"]
