study: esp_table1_bf16_preflight
description: ESP Table 1 Qwen3-8B BF16 dynamic/pruned protocol preflight, untimed
experiment:
  name: esp_table1_bf16_preflight
recipe: recipe.py
freeze: true
provenance:
  include:
  - docs/PLAN.md
  - docs/modelscope_snapshot.json
  - docs/prompts_manifest.json
  - docs/specbench-source.json
  - untimed_4b.py
flow:
  study_phases: true
  prepare_shared: false
axes:
  algorithm.config:
  - task: esp_mtp
    spec:
      method: esp
      num_masks: 1
      block_complexity: 10
      impl: naive
      tree:
        mode: dynamic
        pruning: true
      mask:
        init: mean_prompt
        lam: 0.1
        update: true
  - task: esp_mtp
    spec:
      method: esp
      num_masks: 1
      block_complexity: 30
      impl: naive
      tree:
        mode: dynamic
        pruning: true
      mask:
        init: mean_prompt
        lam: 0.1
        update: true
  - task: esp_mtp
    spec:
      method: esp
      num_masks: 2
      block_complexity: 60
      impl: naive
      tree:
        mode: dynamic
        pruning: true
      mask:
        init: mean_prompt
        lam: 0.1
        update: true
seeds:
- 123
