study: esp_table1_bf16_reduction_check
description: ESP-only BF16 13-prompt three-BC validation with reduced-precision reduction
  disabled
experiment:
  name: esp_table1_bf16_reduction_check
recipe: recipe.py
freeze: true
provenance:
  include:
  - docs/PLAN.md
  - docs/modelscope_snapshot.json
  - docs/prompts_manifest.json
  - docs/specbench-source.json
  - untimed_4b.py
  - numerics.py
  - docs/preceding_results.json
flow:
  study_phases: true
  prepare_shared: false
axes:
  algorithm.config:
  - task: esp_mtp
    spec:
      method: esp
      num_masks: 1
      block_complexity: 10
      impl: naive
      tree:
        mode: dynamic
        pruning: true
      mask:
        init: mean_prompt
        lam: 0.1
        update: true
    numerics:
      bf16_reduced_precision_reduction: false
      deterministic: false
  - task: esp_mtp
    spec:
      method: esp
      num_masks: 1
      block_complexity: 30
      impl: naive
      tree:
        mode: dynamic
        pruning: true
      mask:
        init: mean_prompt
        lam: 0.1
        update: true
    numerics:
      bf16_reduced_precision_reduction: false
      deterministic: false
  - task: esp_mtp
    spec:
      method: esp
      num_masks: 2
      block_complexity: 60
      impl: naive
      tree:
        mode: dynamic
        pruning: true
      mask:
        init: mean_prompt
        lam: 0.1
        update: true
    numerics:
      bf16_reduced_precision_reduction: false
      deterministic: false
seeds:
- 123
