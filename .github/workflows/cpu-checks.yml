# CPU correctness + smoke.
# Work-branch pushes, PRs into dev/main, and the dev commit after a merge.
# Same entry as local runs: python -m pytest tests/spec_mtp (see docs/CI.md).
# RPipe is installed from the commit pinned in pyproject.toml (public GitHub, no secrets).
# GPU model runs are not part of this workflow. This is not a release build.
name: cpu-checks

on:
  push:
    branches: ['feature/**', 'fix/**', 'refactor/**', 'dev']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          # Resolves the pinned RPipe dependency together with this package.
          pip install -e ".[dev]"

      - name: Lint (pyflakes errors only)
        run: |
          pip install "ruff==0.17.0"
          ruff check src tests studies tools

      - name: Type check (mypy, files and tiers in pyproject.toml)
        run: |
          pip install "mypy==2.4.0" "types-PyYAML==6.0.12.20260906"
          mypy

      - name: Check RPipe pin and entry points
        run: |
          python - <<'PY'
          import importlib.metadata as m, json
          url = json.loads(m.distribution('rpipe').read_text('direct_url.json'))
          print('rpipe', url['url'], url['vcs_info']['commit_id'])
          eps = {e.name: e.value for e in m.entry_points(group='console_scripts') if e.name in ('rpipe', 'spec-mtp')}
          assert eps == {'rpipe': 'rpipe.flow.cli:main', 'spec-mtp': 'spec_mtp.cli:main'}, eps
          PY

      - name: Run spec_mtp tests
        env:
          PYTHONUTF8: "1"
          MPLBACKEND: Agg
        run: python -m pytest tests/spec_mtp
