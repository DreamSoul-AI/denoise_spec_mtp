# Figure 2 reproduction: per-layer cosine similarity between mask and
# true-next-token hidden states on 100 Dolly creative-writing samples,
# split by mask Top-1 acceptance (LLaMA3.2-3B-Instruct).
run:
  algorithm: alignment_probe
  stages: [test]
  save_root: results/hf/llama3_2_3b
  save_name: alignment_probe
  seed: 123
  deterministic: false

data:
  name: dolly
  dolly_category: creative_writing
  num_prompts: 100
  max_prompt_len: 1024

model:
  type: hf_causal
  name_or_path: meta-llama/Llama-3.2-3B-Instruct
  local_files_only: false
  torch_dtype: bfloat16
  attn_implementation: eager

eval:
  device: auto
  max_new_tokens: 64          # greedy rollout that supplies the "true" tokens
  temperature: 0.0
  stop_on_eos: true
  num_eval_prompts: 100
  probe_steps_per_prompt: 16

spec:
  method: esp
  num_masks: 1
  mask:
    init: mean_prompt
    lam: 0.1
    update: true
