# CPU smoke test: random tiny LLaMA, synthetic prompts, no downloads.
# run_ar_baseline doubles as the losslessness audit (exact_match must be 1.0).
run:
  algorithm: esp_mtp
  stages: [test]
  save_root: results/smoke/tiny_llama
  save_name: esp_dynamic
  seed: 123
  deterministic: false

data:
  name: local_prompts
  mode: synthetic
  vocab_size: 256
  prompt_len: 32
  num_prompts: 4
  seed: 0

model:
  type: tiny_llama
  attn_implementation: eager
  tiny:
    vocab_size: 256
    hidden_size: 64
    intermediate_size: 128
    num_layers: 2
    num_heads: 4
    num_kv_heads: 2
    max_position_embeddings: 1024

eval:
  device: cpu
  max_new_tokens: 32
  temperature: 0.0
  stop_on_eos: false
  num_eval_prompts: 4
  run_ar_baseline: true
  log_per_prompt: true

spec:
  method: esp
  num_masks: 2
  block_complexity: 30
  impl: naive              # dynamic trees require the naive mask path
  tree:
    mode: dynamic
    pruning: true
  mask:
    init: mean_prompt
    lam: 0.1
    update: true
