# EMA-velocity (ours): identical to the ESP config except Eq (4)/(5) are
# replaced by velocity extrapolation (see notes/ema_velocity_method.md).
run:
  algorithm: esp_mtp
  stages: [test]
  save_root: results/hf/llama3_2_3b
  save_name: ema_bc60_static
  seed: 123
  deterministic: false

data:
  name: specbench
  path: data/spec_bench/question.jsonl
  categories: null
  apply_chat_template: true
  max_prompt_len: 2048

model:
  type: hf_causal
  name_or_path: meta-llama/Llama-3.2-3B-Instruct
  local_files_only: false
  torch_dtype: bfloat16
  attn_implementation: eager

eval:
  device: auto
  max_new_tokens: 100
  temperature: 0.0
  stop_on_eos: true
  num_eval_prompts: 480
  run_ar_baseline: true
  log_per_prompt: true

spec:
  method: ema_velocity
  num_masks: 2
  impl: efficient
  tree:
    mode: static
    branches: [15, 4]
    pruning: true
  ema:                        # ours: EMA-of-differences velocity extrapolation
    beta: 0.9
    step_scale: 1.0
    update: true
