[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "denoise-spec-mtp"
version = "0.1.0"
description = "ESP speculative MTP reproduction and EMA-velocity masks; depends on RPipe"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  # RPipe dev, pinned. Update together with docs/LAYOUT.md.
  "rpipe @ git+https://github.com/diaoenmao/RPipe.git@ce8b3e6453d282711f0032b73409e147a49d49fa",
  "accelerate",
  "datasets",
  "kornia",
  "matplotlib",
  "numpy",
  "PyYAML",
  "scipy",
  "torch",
  "torchvision",
  "transformers>=4.45",
]

[project.scripts]
spec-mtp = "spec_mtp.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["spec_mtp*"]

[tool.pytest.ini_options]
testpaths = ["tests/spec_mtp"]
pythonpath = ["src"]
addopts = "-q --tb=short"
cache_dir = ".tmp/pytest-cache"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Errors only (pyflakes + syntax); no style rewrite of the research code.
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# Decoder kept byte-identical in the refactor; `block_size` is an unused local.
"src/spec_mtp/structure/algorithm/decoding.py" = ["F841"]
